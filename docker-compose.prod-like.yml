services:
  callora-backend:
    image: callora/backend:prod-like
    build:
      context: .
      dockerfile: src/Host/Backend/Dockerfile
    container_name: ${DEV_CALLORA_CONTAINER_NAME:-callora-backend-prod-like}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DEV_CALLORA_PORT:-5000}:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      CalloraHosting__AutoBootstrapModules: ${CalloraHosting__AutoBootstrapModules:-true}
      CalloraHosting__AutoLoadPlugins: ${CalloraHosting__AutoLoadPlugins:-true}
      CalloraHosting__PluginDirectory: ${CalloraHosting__PluginDirectory:-custom/plugins}
      CalloraHosting__PluginRegistryFilePath: ${CalloraHosting__PluginRegistryFilePath:-custom/plugins/registry.json}
      CalloraHosting__AutoActivateInstalledPlugins: ${CalloraHosting__AutoActivateInstalledPlugins:-true}
      BackendHost__DatabaseConnectionString: Host=postgres;Port=5432;Database=${DEV_POSTGRES_DB:-callora_host};Username=${DEV_POSTGRES_USER:-callora};Password=${DEV_POSTGRES_PASSWORD:-callora}
      BackendHost__EnableTenantManagementApi: ${BackendHost__EnableTenantManagementApi:-false}
      BackendHost__DefaultTenantKey: ${BackendHost__DefaultTenantKey:-default}
      BackendHost__DefaultTenantDisplayName: ${BackendHost__DefaultTenantDisplayName:-Default Tenant}
      BackendHost__AuditFilePath: ${BackendHost__AuditFilePath:-plugins/audit-log.jsonl}
      BackendHost__AdminShellBaseUrl: ${BackendHost__AdminShellBaseUrl:-/admin/}
      BackendHost__WorkspaceShellBaseUrl: ${BackendHost__WorkspaceShellBaseUrl:-/}
      BackendHost__PluginAssetBaseUrl: ${BackendHost__PluginAssetBaseUrl:-/plugin-assets}
      BackendHost__PluginManifestUrl: ${BackendHost__PluginManifestUrl:-/manifests/plugin-ui-assets.manifest.json}
      BackendHost__RequireAllowlistForActivation: ${BackendHost__RequireAllowlistForActivation:-false}
      BackendHost__ActivationAllowlistPluginIds__0: ${BackendHost__ActivationAllowlistPluginIds__0:-communication}
      BackendHost__ActivationEntitledPluginIds__0: ${BackendHost__ActivationEntitledPluginIds__0:-communication}
      BackendHost__DefaultActivationRolloutRing: ${BackendHost__DefaultActivationRolloutRing:-Stable}
      BackendHost__EntitlementFailureFallbackMode: ${BackendHost__EntitlementFailureFallbackMode:-DenyActivation}
      BackendHost__AllowUnsignedPlugins: ${BackendHost__AllowUnsignedPlugins:-true}
      BackendHost__RequireApiKeyAuthentication: ${BackendHost__RequireApiKeyAuthentication:-true}
      BackendHost__ApiKeyHeaderName: ${BackendHost__ApiKeyHeaderName:-X-Callora-Api-Key}
      BackendHost__ApiKeys__0: ${BackendHost__ApiKeys__0:-callora-local-dev-key-change-me}

  callora-admin-shell:
    image: callora/admin-shell:prod-like
    build:
      context: .
      dockerfile: apps/admin-shell/Dockerfile
    restart: unless-stopped

  callora-workspace-shell:
    image: callora/workspace-shell:prod-like
    build:
      context: .
      dockerfile: apps/workspace-shell/Dockerfile
    restart: unless-stopped

  callora-frontdoor:
    image: caddy:2.8
    container_name: ${DEV_FRONTDOOR_CONTAINER_NAME:-callora-frontdoor-prod-like}
    restart: unless-stopped
    depends_on:
      callora-backend:
        condition: service_started
      callora-admin-shell:
        condition: service_started
      callora-workspace-shell:
        condition: service_started
    ports:
      - "${DEV_FRONTDOOR_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-callora-backend:5000}
      ADMIN_UI_UPSTREAM: ${ADMIN_UI_UPSTREAM:-callora-admin-shell:80}
      WORKSPACE_UI_UPSTREAM: ${WORKSPACE_UI_UPSTREAM:-callora-workspace-shell:80}
    volumes:
      - ./ops/local-frontdoor/Caddyfile:/etc/caddy/Caddyfile:ro

  postgres:
    image: postgres:16
    container_name: ${DEV_POSTGRES_CONTAINER_NAME:-callora-postgres-prod-like}
    restart: unless-stopped
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-callora_host}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-callora}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-callora}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-callora} -d ${DEV_POSTGRES_DB:-callora_host}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - callora-postgres-data-prod-like:/var/lib/postgresql/data

volumes:
  callora-postgres-data-prod-like:
