# Automatische Dependency-Updates (QS-Review 2026-07): NuGet, npm-Shells
# und GitHub Actions, wöchentlich gebündelt.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Jedes aktive npm-Verzeichnis wird abgedeckt (#121). Nicht gelistet: custom/plugins/*
  # (Beispiel-Plugins, werden entfernt) und custom/static-plugins/_archive/* (archiviert).
  - package-ecosystem: npm
    directory: /src/Administration/Resources/app/administration
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/Surface.Rendering/Resources/app/surface
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /custom/surface-sdk
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /custom/static-plugins/Communication/src/Resources/app/admin
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
