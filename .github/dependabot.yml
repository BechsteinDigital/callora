# Automatische Dependency-Updates (QS-Review 2026-07): NuGet, npm-Shells
# und GitHub Actions, wöchentlich gebündelt.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/workspace-shell
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/legacy-admin-shell
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/shell-core
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/shell-design
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
