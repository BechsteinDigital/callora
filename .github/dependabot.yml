# Automatische Dependency-Updates (QS-Review 2026-07): NuGet, npm-Shells
# und GitHub Actions, wöchentlich gebündelt.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/Administration/Resources/app/administration
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  # Surface-Runtime (ausgeliefert)
  - package-ecosystem: npm
    directory: /src/Surface.Rendering/Resources/app/surface
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  # Surface-SDK (an Plugin-Autoren ausgeliefert)
  - package-ecosystem: npm
    directory: /custom/static-plugins/Communication/src/Resources/app/admin
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  # SurfaceDemo-Referenzplugin
  - package-ecosystem: npm
    directory: /custom/plugins/SurfaceDemo
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]

  # Doku-Site
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
