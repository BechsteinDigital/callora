# Automatische Dependency-Updates (QS-Review 2026-07): NuGet, npm-Shells
# und GitHub Actions, wöchentlich gebündelt.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/Administration/Resources/app/administration
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
    # TypeScript wird zurückgehalten, und das ist der Grund: Die Gruppe hob es auf ^7.0.2,
    # während typescript-eslint@8.68 `typescript >=4.8.4 <6.1.0` als Peer verlangt. `npm ci`
    # scheiterte damit in sechs Sekunden — und weil die Gruppe alles in EINEN Pull Request
    # packt, blockierte dieser eine Konflikt die dreizehn anderen Updates gleich mit
    # (PR #371, offen seit dem 30.08.). Ein Audit-Gate, dessen Update-Weg verstopft ist,
    # fordert eine Handlung, die niemand ausführen kann.
    #
    # Wieder entfernen, sobald typescript-eslint TypeScript 7 als Peer zulässt. Bis dahin
    # ist die Sperre sichtbar hier statt unsichtbar als roter Dependabot-PR.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # Surface-Runtime (ausgeliefert). Dieselbe TypeScript-Sperre wie oben, aus demselben
  # Grund — die Shell trägt dieselben Versionen (PR #370, ebenfalls seit dem 30.08. rot).
  - package-ecosystem: npm
    directory: /src/Surface.Rendering/Resources/app/surface
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
    # TypeScript wird zurückgehalten, und das ist der Grund: Die Gruppe hob es auf ^7.0.2,
    # während typescript-eslint@8.68 `typescript >=4.8.4 <6.1.0` als Peer verlangt. `npm ci`
    # scheiterte damit in sechs Sekunden — und weil die Gruppe alles in EINEN Pull Request
    # packt, blockierte dieser eine Konflikt die dreizehn anderen Updates gleich mit
    # (PR #371, offen seit dem 30.08.). Ein Audit-Gate, dessen Update-Weg verstopft ist,
    # fordert eine Handlung, die niemand ausführen kann.
    #
    # Wieder entfernen, sobald typescript-eslint TypeScript 7 als Peer zulässt. Bis dahin
    # ist die Sperre sichtbar hier statt unsichtbar als roter Dependabot-PR.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # Hier standen einmal Einträge für die Plugins Communication und Composer unter
  # /custom/static-plugins/. Dort liegen im Repository nur .gitkeep und README.md: Die
  # Plugins haben nach ADR-020 eigene Repositories, und ihre npm-Updates gehören dorthin.
  # Dependabot lief also erneut ins Leere — dieselbe Fehlerform, die der Kommentar an
  # dieser Stelle vorher beschrieb, nur eine Ebene höher. Ein Eintrag, der nichts findet,
  # ist schlimmer als keiner: Er sieht nach Abdeckung aus.

  # Doku-Site
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
