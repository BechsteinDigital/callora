name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docfx/**"
      - "src/**"
      - "custom/plugins/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "docfx/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint docs (markdownlint + cspell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # ubuntu-latest ships a current Node LTS, sufficient for the doc tooling.
      - name: Install doc tooling
        working-directory: docs-site
        run: npm ci

      - name: Lint Markdown + spelling
        working-directory: docs-site
        run: npm run lint

  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # The conceptual site (VitePress). Its build fails on any internal dead link.
      - name: Build VitePress site
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # The .NET API reference (DocFX). No --warningsAsErrors: docfx 2.78 emits a
      # harmless FailedToLoadAnalyzer (Razor) warning against the newer .NET 10 SDK.
      - name: Build DocFX .NET API reference
        run: |
          dotnet tool restore
          dotnet docfx docfx/docfx.json

      # Serve the VitePress site at the root and the DocFX reference under /api/
      # (the VitePress nav links to /api/, excluded from its dead-link check).
      - name: Assemble combined site
        run: |
          mkdir -p docs-site/.vitepress/dist/api
          cp -r _site/. docs-site/.vitepress/dist/api/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, build]
    # Deploy only from main and only once opted in via the DOCS_DEPLOY repo
    # variable. The repository is private today; enable Pages (Settings ->
    # Pages -> Source: GitHub Actions) and set DOCS_DEPLOY=true for the public
    # Community Edition. Until then this job is skipped, keeping CI green.
    if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
