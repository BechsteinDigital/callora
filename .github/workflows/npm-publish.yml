name: npm publish

# Veröffentlicht @callora/surface und @callora/admin auf einen Tag v*, denselben Tag, der
# release.yml für die NuGet-Pakete auslöst. Beide Seiten kommen aus einem Release, weil sie
# zwei Hälften desselben Vertrags sind: @callora/surface ist die Client-Hälfte, deren
# Server-Hälfte Callora.Surface.Rendering ist. Driften sie auseinander, merkt das niemand
# außer einem Kunden.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur packen und den Inhalt zeigen, nicht veröffentlichen"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@callora/surface"
            path: src/Surface.Rendering/Resources/app/surface
          - package: "@callora/admin"
            path: src/Administration/Resources/app/administration
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      # Trusted Publishing verlangt npm 11.5.1 oder neuer. Node 22 bringt 10.9.x mit,
      # und mit dem scheitert der Publish nicht etwa mit einem Hinweis auf die Version,
      # sondern mit einem gewöhnlichen 401 — die CLI kennt den OIDC-Weg schlicht nicht
      # und schickt den Token, den es nicht gibt.
      - name: npm auf eine Version mit Trusted Publishing heben
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      # Die Bibliothek, nicht die App: dist-lib ist das, was die files-Liste ausliefert.
      - name: Build library
        run: npm run build:lib

      # Der Tag bestimmt die Version, nicht umgekehrt. Ohne diese Prüfung veröffentlicht
      # ein v0.9.1-Tag stillschweigend erneut 0.9.0 — npm lehnt das ab, aber erst nach dem
      # Bauen, und die Fehlermeldung nennt den Grund nicht.
      - name: Tag und Paketversion stimmen überein
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME sagt $TAG, package.json sagt $PKG."
            exit 1
          fi
          echo "Version: $PKG"

      # Was wirklich im Tarball landet — im Log nachlesbar, bevor es unwiderruflich ist.
      - name: Paketinhalt zeigen
        run: npm pack --dry-run

      # Die Version kann bereits draußen sein: 0.9.0 wurde von Hand veröffentlicht,
      # bevor dieser Weg je gelaufen ist. npm lehnt ein zweites Publish derselben
      # Version ab — zu Recht, aber der Lauf wird davon rot, obwohl nichts fehlt und
      # niemand etwas tun kann. NuGet hat dafür --skip-duplicate, npm hat kein
      # Gegenstück, also wird vorher gefragt.
      - name: Version schon veröffentlicht?
        id: published
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version > /dev/null 2>&1; then
            echo "::notice::$PKG@$VER liegt bereits auf npm — Publish wird übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Kein NODE_AUTH_TOKEN: Die Anmeldung läuft über Trusted Publishing, also über den
      # OIDC-Token, den `permissions: id-token: write` weiter oben erlaubt. npm tauscht
      # ihn gegen ein kurzlebiges Recht auf genau dieses Paket — es gibt kein Geheimnis
      # mehr, das gestohlen, geteilt oder vergessen werden kann. Der Grund, dass es hier
      # überhaupt eines gab: Der Account ist per Passkey gesichert, `--otp=` hat also
      # nichts anzubieten, und der Ausweg war ein granulares Token mit 2FA-Bypass — ein
      # dauerhafter Schlüssel, der genau die Prüfung umgeht, für die er ausgestellt wurde.
      #
      # Einzurichten pro Paket unter npmjs.com/package/<name>/access, Abschnitt
      # "Trusted Publisher": dieses Repository und der Dateiname dieses Workflows
      # (npm-publish.yml). Beides muss stimmen, sonst lehnt die Registry ab.
      #
      # --provenance bleibt stehen. Die Dokumentation sagt, es geschehe bei Trusted
      # Publishing von selbst; in der Praxis ist es das nicht, und ein Paket ohne
      # Provenance fällt niemandem auf, der nicht danach sucht.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public
