name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs-site/**"
      - "docfx/**"
      - "docs/**"
      - "ops/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs-site/**"
      - "docfx/**"
      - "docs/**"
      - "ops/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Die Landkarte ist der Einstieg für jeden, der das Repository nicht kennt —
      # und für jeden Agenten. Eine veraltete Karte ist schlimmer als keine: Sie
      # klingt plausibel und wird geglaubt. Das Skript scheitert außerdem von
      # selbst, wenn es auf ein Verzeichnis zeigt, das es nicht mehr gibt (genau
      # das war bei der Vorgängerfassung über Monate der Fall).
      - name: Landkarte aktuell?
        run: |
          bash scripts/build-repo-map.sh
          git diff --exit-code docs/REPO_MAP.md

      - name: Restore
        run: dotnet restore Callora.Host.sln

      - name: Build
        run: dotnet build Callora.Host.sln --no-restore --configuration Release

      # Läuft komplett ohne externe Dienste (InMemory-Stores); enthält auch die
      # Architektur-Tests (keine partial/nested types, ein Typ pro Datei, DDD-Layering).
      # Ein Retry bei Fehlschlag: die Suite parallelisiert; unter CI-Last können sehr seltene
      # Timing-Races einzelne Tests kippen (23 lokale Full-Runs → 0 Repro, daher nicht punktgenau
      # isolierbar). Ein ECHTER (deterministischer) Fehler scheitert BEIDE Versuche → Step bleibt
      # rot; ein Flaky besteht den Retry → grün, wird aber als ::warning:: sichtbar geloggt (kein
      # stilles Übertünchen). Extra-Kosten fallen nur beim seltenen Fehlschlag an, nicht im Happy
      # Path — bewusst statt globalem Parallelitäts-Drosseln, das jeden Lauf verlangsamen würde.
      # Vor dem Retry wird ./test-results geleert, damit das Coverage-Gate nur den erfolgreichen
      # Lauf sieht (sonst könnte find|head-1 die Teilabdeckung des Fehlversuchs greifen).
      - name: Test
        run: |
          run_tests() {
            dotnet test Callora.Host.sln --no-build --configuration Release \
              --logger "console;verbosity=normal" \
              --collect:"XPlat Code Coverage" --results-directory ./test-results
          }
          if ! run_tests; then
            echo "::warning::Test-Lauf fehlgeschlagen — ein Retry wegen seltener Parallel-Timing-Flakiness (ein echter Fehler scheitert beide Male)."
            rm -rf ./test-results
            run_tests
          fi

      # Ratchet-Gate (PLAT-220): Baseline am 2026-07-13 lag bei 28,3 % Line-
      # Coverage; das Gate hält 25 % und wird mit wachsender Abdeckung angehoben.
      #
      # Über ALLE Berichte gerechnet, nicht über den ersten. Der Lauf erzeugt zwei —
      # Callora.Core.Tests (~84.000 Zeilen) und Callora.Analyzers.Tests (~280) — und
      # `find | head -1` griff, je nach Dateisystem-Reihenfolge, den kleinen: 93,6 %
      # gemeldet, 33,6 % tatsächlich. Ein Gate, das den Analyzer-Bericht misst, hätte
      # auch eine auf null eingebrochene Kern-Abdeckung durchgewinkt.
      - name: Enforce coverage threshold
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          threshold = 0.25
          reports = glob.glob("./test-results/**/coverage.cobertura.xml", recursive=True)
          if not reports:
              sys.exit("No coverage report found.")

          covered = valid = 0
          for report in reports:
              root = ET.parse(report).getroot()
              covered += int(root.get("lines-covered"))
              valid += int(root.get("lines-valid"))
              print(f"  {float(root.get('line-rate')):6.1%}  {root.get('lines-valid'):>7} lines  {report}")

          rate = covered / valid if valid else 0.0
          print(f"line coverage: {rate:.1%} over {valid} lines (threshold {threshold:.0%})")
          sys.exit(0 if rate >= threshold else 1)
          EOF

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: ./test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

  frontends:
    name: ${{ matrix.name }} (${{ matrix.gates }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # No fail-fast: one workspace breaking should not hide the state of the others,
      # which is the whole point of gating them separately.
      fail-fast: false
      matrix:
        include:
          - name: Surface Runtime
            path: src/Surface.Rendering/Resources/app/surface
            gates: test + build
            test: true
          # Communication und Composer bauen in ihren eigenen Repositories (ADR-020).
          # Was hier bleiben MUSS, ist der Beweis, dass die SDK-Pakete, gegen die sie
          # bauen, gebaut werden können — das leistet der admin-frontend-Job mit
          # `npm run build:lib` plus dem Paketvertrag-Schritt.
          - name: Docs Site
            path: docs-site
            gates: lint + build
            test: false
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      # A file: dependency links the source directory, not a published tarball, and the
      # library output is gitignored. So the dependency resolves, the install succeeds,
      # and the build then fails on ERR_MODULE_NOT_FOUND for the preset — which is how
      # this job failed on every run before it built its dependency first.
      - name: Build local package dependencies
        if: matrix.sdkPaths
        working-directory: .
        run: |
          for sdk in ${{ matrix.sdkPaths }}; do
            ( cd "$sdk" && npm ci && npm run build:lib )
          done

      - name: Install
        run: npm ci

      # Shipped dependencies are the gate. A vulnerable test runner is worth knowing about and
      # worth fixing, but it never reaches a customer — blocking on it would train everyone to
      # ignore the signal that does.
      - name: Audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (all dependencies, advisory)
        run: npm audit --audit-level=high || true

      - name: Test
        if: matrix.test
        run: npm run test

      - name: Lint
        if: matrix.name == 'Docs Site'
        run: npm run lint

      - name: Build
        run: npm run build

  admin-frontend:
    name: Admin Shell (Vitest + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Administration/Resources/app/administration
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Administration/Resources/app/administration/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (all dependencies, advisory)
        run: npm audit --audit-level=high || true

      # Der Extension-Point-Katalog wird aus der Shell generiert. Wanderte ein Slot,
      # ohne dass jemand neu generiert, verspräche @callora/admin einen Punkt, den es
      # nicht mehr gibt — und der Typfehler träfe den Plugin-Autor statt uns.
      - name: Katalog aktuell?
        run: |
          npm run generate:catalog
          git diff --exit-code src/core/extensions/catalog.generated.ts src/core/extensions/catalog.json

      # Die Vitest-Suite (Slots/Hooks/Services/Loader + alle Admin-Module) läuft
      # als eigener Gate-Schritt, damit UI-Verhaltensregressionen main nicht
      # erreichen; der Build (vue-tsc + vite) folgt als Typ-/Bundle-Check.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build library
        run: npm run build:lib

      # Nach dem Bibliotheks-Build, weil beide Tests gegen dist-lib prüfen: dass jeder
      # Export auf eine gebaute Datei zeigt, und dass die Scope-Ids der Bibliothek im
      # Anwendungs-Build vorkommen. Bräche das, blieben Plugin-Seiten ungestylt.
      - name: Paketvertrag prüfen
        run: npx vitest run src/public/exports.test.ts src/public/scoped-styles.test.ts
