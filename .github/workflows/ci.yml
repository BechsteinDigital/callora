name: CI

# Was bei jedem Pull Request und auf main laufen muss. Alles, was an einem Tag hängt,
# steht in release.yml und npm-publish.yml; die Doku hat einen eigenen Lauf, weil sie
# einen Deploy anhängt und von Codeänderungen nur selten betroffen ist.
#
# Vier Jobs, nach Rückmeldezeit sortiert statt nach Technologie:
#
#   dotnet        Karte, Build, schnelle Tests — die Antwort, die man zuerst will
#   integration   Was ein echtes Postgres braucht (ein Container, nicht elf)
#   frontends     Die drei npm-Arbeitsbereiche DIESES Repositories
#   contracts     Der Weg eines fremden Plugin-Autors, von außen
#
# Sie hängen bewusst nicht voneinander ab: Ein rotes Frontend soll nichts über den
# Zustand der Tests verschweigen, und wer wartet, wartet auf den langsamsten Job und
# nicht auf eine Kette.
#
# NICHT hier: alles unter custom/. Diese Verzeichnisse sind Installationsziele und
# gitignoriert (ADR-020) — auf einem Runner sind sie leer, auf einer Entwicklermaschine
# liegen dort Klone fremder Repositories. Ein Gate, das den Zustand einer fremden
# Arbeitskopie prüft, wird ignoriert statt erfüllt.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs-site/**"
      - "docfx/**"
      - "docs/**"
      - "ops/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs-site/**"
      - "docfx/**"
      - "docs/**"
      - "ops/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kürzt die Ausgabe jedes dotnet-Aufrufs. Das Protokoll eines grünen Laufs soll man
  # überfliegen können; ein roter Lauf ist ohnehin laut genug (eine fehlgeschlagene
  # DI-Prüfung allein schreibt über zweihundert Zeilen Stacktrace).
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dotnet:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Zuerst, weil es eine Sekunde dauert und einen ganzen Lauf spart: Eine veraltete
      # Karte ist schlimmer als keine — sie klingt plausibel und wird geglaubt.
      - name: Landkarte aktuell?
        run: |
          bash scripts/build-repo-map.sh
          git diff --exit-code docs/REPO_MAP.md

      - name: Build
        run: |
          dotnet restore Callora.Host.sln --verbosity quiet
          dotnet build Callora.Host.sln --no-restore --configuration Release --verbosity minimal

      # Ohne die Docker-Stufe: Die läuft im integration-Job und braucht dort zwei Minuten
      # länger. Wer eine Zeile Code ändert, soll nicht darauf warten, um zu erfahren, dass
      # die Suite grün ist.
      - name: Test (schnelle Stufe)
        run: |
          rm -rf ./test-results
          dotnet test Callora.Host.sln --no-build --configuration Release \
            --filter "Category!=Slow" \
            --collect:"XPlat Code Coverage" --results-directory ./test-results \
            --logger "console;verbosity=minimal"

      - name: Abdeckung über der Schwelle?
        run: python3 scripts/coverage-gate.py --threshold 0.25

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: ./test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Testcontainers startet EIN Postgres für die gesamte Stufe (PostgresFixture);
      # isoliert wird über eine eigene Datenbank je Test. Vorher baute jede der elf
      # Testklassen ihren eigenen Container.
      - name: Test (Docker-Stufe)
        run: |
          dotnet test Callora.Host.sln --configuration Release \
            --filter "Category=Slow" \
            --logger "console;verbosity=minimal" \
            -p:SkipAdminFrontend=true -p:SkipSurfaceFrontend=true

  frontends:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Kein fail-fast: Ein kaputter Arbeitsbereich soll den Zustand der anderen nicht
      # verdecken — genau dafür sind sie getrennt.
      fail-fast: false
      matrix:
        include:
          - name: Admin Shell
            path: src/Administration/Resources/app/administration
            test: true
            catalog: true
          - name: Surface Runtime
            path: src/Surface.Rendering/Resources/app/surface
            test: true
            catalog: false
          - name: Docs Site
            path: docs-site
            test: false
            catalog: false
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      # Ausgelieferte Abhängigkeiten sind das Gate. Ein verwundbarer Testrunner ist
      # wissenswert und behebenswert, erreicht aber keinen Kunden — darauf zu blockieren
      # erzieht dazu, auch das Signal zu ignorieren, das ihn erreicht.
      - name: Audit (ausgelieferte Abhängigkeiten)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (alle, nur zur Kenntnis)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Test
        if: matrix.test
        run: npm run test

      - name: Build
        run: npm run build

      # Der Katalog der Erweiterungspunkte wird aus den Quellen erzeugt. Weicht das
      # Ergebnis ab, verspricht @callora/admin einen Slot, den es nicht mehr gibt — oder
      # verschweigt einen neuen, gegen den dann niemand kompilieren kann.
      - name: Erweiterungspunkt-Katalog aktuell?
        if: matrix.catalog
        run: |
          npm run generate:catalog
          git diff --exit-code src/core/extensions/

      # Nur die Admin-Shell und die Surface-Runtime sind npm-Pakete; die Docs-Site ist
      # eine Website. `files` entscheidet, was ein Plugin-Autor wirklich bekommt.
      - name: Paket baut und enthält, was es verspricht
        if: matrix.test
        run: |
          npm run build:lib
          npm pack --dry-run

  contracts:
    name: Golden Path (Plugin von außen)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Die Kette, die ein fremder Plugin-Autor durchläuft: packen → Werkzeug
      # installieren → plugin new → publish → test-contract → sign, plus der Gegenbeweis,
      # dass CAL0001 den Build eines Plugins bricht, das nur das SDK-Paket referenziert.
      #
      # Es existiert, weil kein Test INNERHALB dieses Repositories die Paketgrenze
      # überquert. Der erste Lauf fand vier Probleme, die die Suite nie hätte finden
      # können — eine Sicherheitsfestlegung, die nie im nuspec ankam, ein SDK, das seine
      # Analyzer stillschweigend zurückhielt, einen Publish-Filter, der nur zur Bauzeit
      # wirkte, und einen, der die eigene Assembly des Plugins löschte.
      - name: Golden Path
        run: ./scripts/golden-path.sh
