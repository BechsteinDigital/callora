name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs-site/**"
      - "docfx/**"
      - "docs/**"
      - "ops/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs-site/**"
      - "docfx/**"
      - "docs/**"
      - "ops/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Callora.Host.sln

      - name: Build
        run: dotnet build Callora.Host.sln --no-restore --configuration Release

      # Läuft komplett ohne externe Dienste (InMemory-Stores); enthält auch die
      # Architektur-Tests (keine partial/nested types, ein Typ pro Datei, DDD-Layering).
      # Ein Retry bei Fehlschlag: die Suite parallelisiert; unter CI-Last können sehr seltene
      # Timing-Races einzelne Tests kippen (23 lokale Full-Runs → 0 Repro, daher nicht punktgenau
      # isolierbar). Ein ECHTER (deterministischer) Fehler scheitert BEIDE Versuche → Step bleibt
      # rot; ein Flaky besteht den Retry → grün, wird aber als ::warning:: sichtbar geloggt (kein
      # stilles Übertünchen). Extra-Kosten fallen nur beim seltenen Fehlschlag an, nicht im Happy
      # Path — bewusst statt globalem Parallelitäts-Drosseln, das jeden Lauf verlangsamen würde.
      # Vor dem Retry wird ./test-results geleert, damit das Coverage-Gate nur den erfolgreichen
      # Lauf sieht (sonst könnte find|head-1 die Teilabdeckung des Fehlversuchs greifen).
      - name: Test
        run: |
          run_tests() {
            dotnet test Callora.Host.sln --no-build --configuration Release \
              --logger "console;verbosity=normal" \
              --collect:"XPlat Code Coverage" --results-directory ./test-results
          }
          if ! run_tests; then
            echo "::warning::Test-Lauf fehlgeschlagen — ein Retry wegen seltener Parallel-Timing-Flakiness (ein echter Fehler scheitert beide Male)."
            rm -rf ./test-results
            run_tests
          fi

      # Ratchet-Gate (PLAT-220): Baseline am 2026-07-13 lag bei 28,3 % Line-
      # Coverage; das Gate hält 25 % und wird mit wachsender Abdeckung angehoben.
      - name: Enforce coverage threshold
        run: |
          REPORT=$(find ./test-results -name coverage.cobertura.xml | head -1)
          if [ -z "$REPORT" ]; then
            echo "No coverage report found." && exit 1
          fi
          python3 - "$REPORT" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          threshold = 0.25
          rate = float(ET.parse(sys.argv[1]).getroot().get("line-rate"))
          print(f"line coverage: {rate:.1%} (threshold {threshold:.0%})")
          sys.exit(0 if rate >= threshold else 1)
          EOF

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: ./test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

  admin-frontend:
    name: Admin Shell (Vitest + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Administration/Resources/app/administration
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Administration/Resources/app/administration/package-lock.json

      - name: Install
        run: npm ci

      # Der Extension-Point-Katalog ist generiert und eingecheckt. Neu erzeugen und
      # auf Diff prüfen: so kann ein neuer Slot oder Hook in der Shell nicht landen,
      # ohne dass der Vertrag, gegen den Plugins kompilieren, ihn kennt.
      - name: Katalog aktuell?
        run: |
          npm run generate:catalog
          git diff --exit-code src/core/extensions/catalog.generated.ts src/core/extensions/catalog.json

      # Die Vitest-Suite (Slots/Hooks/Services/Loader + alle Admin-Module) läuft
      # als eigener Gate-Schritt, damit UI-Verhaltensregressionen main nicht
      # erreichen; der Build (vue-tsc + vite) folgt als Typ-/Bundle-Check.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Der Bibliotheks-Build erzeugt, was Plugin-Autoren konsumieren. Er läuft VOR den
      # Tests nicht, sondern hier: der Export-Test prüft dist-lib nur, wenn es existiert,
      # und soll in CI beißen.
      - name: Build library
        run: npm run build:lib

      # Beide Builds liegen jetzt vor: Export-Pfade und die Scope-Id-Annahme prüfen,
      # von der abhängt, ob eine Plugin-Seite ohne eigenes Stylesheet gestylt ist.
      - name: Paketvertrag prüfen
        run: npx vitest run src/public/exports.test.ts src/public/scoped-styles.test.ts

      # Jedes aktive Lockfile bekommt ein Audit-Gate (#121). Schwelle "high": moderate
      # Befunde blockieren main nicht, kritische und hohe schon. Ausnahmen ohne Fix
      # stehen in ops/compliance/npm-risk-acceptance.md.
      - name: Audit
        run: npm audit --audit-level=high

  surface-sdk:
    name: Surface SDK (Vitest + Build + Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [surface-sdk]
    defaults:
      run:
        working-directory: custom/${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custom/${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  surface-runtime:
    name: Surface Runtime (Vitest + Build + Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Surface.Rendering/Resources/app/surface
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Surface.Rendering/Resources/app/surface/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high
