name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Callora.Host.sln

      - name: Build
        run: dotnet build Callora.Host.sln --no-restore --configuration Release

      # Läuft komplett ohne externe Dienste (InMemory-Stores); enthält auch die
      # Architektur-Tests (keine partial/nested types, ein Typ pro Datei, DDD-Layering).
      - name: Test
        run: dotnet test Callora.Host.sln --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory ./test-results

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: ./test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

  build-shells:
    name: Build ${{ matrix.shell }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # legacy-admin-shell bleibt gebaut, bis die neue Admin-Shell den Platz
        # von apps/admin-shell übernimmt.
        shell: [legacy-admin-shell, workspace-shell]
    defaults:
      run:
        working-directory: apps/${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.shell }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
