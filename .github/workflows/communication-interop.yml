name: Communication Interop

# Runs the opt-in Asterisk voice interop tests (Category=Asterisk) against a real Asterisk so main is
# protected from SIP/media regressions. Actions-Budget-bewusst gescoped (privates Repo, 2000 Min/Monat):
# PRs zahlen den SIP-Round-Trip nur bei Änderungen am Communication-Plugin oder der Asterisk-Spike-Config.
# Reine Core-Änderungen (häufig) triggern den 30-min-Lauf NICHT mehr pro PR, werden aber post-merge auf
# main weiterhin abgesichert; zusätzlich per workflow_dispatch manuell auslösbar (z. B. vor einem Release).
on:
  pull_request:
    paths:
      - "custom/static-plugins/Communication/**"
      - "ops/spikes/asterisk-b4deep3/**"
      - ".github/workflows/communication-interop.yml"
  push:
    branches: [main]
    paths:
      - "custom/static-plugins/Communication/**"
      - "src/Core/**"
      - "ops/spikes/asterisk-b4deep3/**"
      - ".github/workflows/communication-interop.yml"
  workflow_dispatch:

concurrency:
  group: comm-interop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Host networking: SIP negotiates dynamic RTP ports, which service-container port mappings cannot
      # forward — the media (echo) round-trip needs the client and Asterisk on the same network namespace.
      - name: Start Asterisk
        run: |
          # Pinned by digest: :latest makes this job's result depend on when it ran, and an
          # interop test that silently changes what it tests against is worse than none.
          #
          # The digest lives in a variable rather than inline, because inline it sat behind
          # a line continuation with a COMMENT between: the comment ends the continuation,
          # so `docker run` received the two -v options and no image at all. Every run of
          # this job failed that way from the moment the pin was introduced.
          ASTERISK_IMAGE=andrius/asterisk@sha256:e1c8eeb4daeaceeca7d8ed6f02c65011002e2d97365ee8a2fa7b0123559754c7
          docker run -d --name callora-asterisk --network host \
            -v "${{ github.workspace }}/ops/spikes/asterisk-b4deep3/pjsip.conf:/etc/asterisk/pjsip.conf" \
            -v "${{ github.workspace }}/ops/spikes/asterisk-b4deep3/extensions.conf:/etc/asterisk/extensions.conf" \
            "$ASTERISK_IMAGE"
          # Wait until the registrar has loaded the AOR before running the tests.
          for i in $(seq 1 30); do
            if docker exec callora-asterisk asterisk -rx "pjsip show aors" 2>/dev/null | grep -q "callora"; then
              echo "Asterisk ready."
              exit 0
            fi
            sleep 1
          done
          echo "Asterisk did not become ready in time." >&2
          docker logs callora-asterisk || true
          exit 1

      - name: Restore
        run: dotnet restore tests/Callora.Core.Tests/Callora.Core.Tests.csproj

      - name: Build test project
        run: dotnet build tests/Callora.Core.Tests/Callora.Core.Tests.csproj --no-restore --configuration Release

      - name: Run Communication interop tests
        env:
          CALLORA_ASTERISK_TESTS: "1"
        run: >-
          dotnet test tests/Callora.Core.Tests/Callora.Core.Tests.csproj
          --no-build --configuration Release
          --filter "Category=Asterisk"
          --logger "console;verbosity=normal"

      - name: Stop Asterisk
        if: always()
        run: docker rm -f callora-asterisk || true
