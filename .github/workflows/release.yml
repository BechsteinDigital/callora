name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # MinVer braucht die Tag-Historie für die Versionsberechnung.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore & Build
        run: dotnet build Callora.Host.sln --configuration Release --nologo

      - name: Test
        run: dotnet test Callora.Host.sln --configuration Release --no-build --nologo

      - name: Publish host backend
        run: >
          dotnet publish src/Host/Backend/Callora.Host.Backend.csproj
          --configuration Release --no-build
          --output artifacts/callora-host

      - name: Generate SBOM (.NET)
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX Callora.Host.sln --json --output artifacts/sbom --filename callora-host.cdx.json

      - name: Generate SBOM (npm shells)
        run: |
          mkdir -p artifacts/sbom
          for shell in workspace-shell shell-core shell-design; do
            if [ -f "apps/$shell/package-lock.json" ] || [ -f "apps/$shell/package.json" ]; then
              (cd "apps/$shell" && npm sbom --sbom-format cyclonedx --package-lock-only > "../../artifacts/sbom/$shell.cdx.json") || echo "SBOM for $shell skipped"
            fi
          done

      - name: Package host artifact
        run: tar -czf artifacts/callora-host.tar.gz -C artifacts/callora-host .

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/callora-host.tar.gz
            artifacts/sbom/*.cdx.json
