name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer braucht die Tag-Historie für die Versionsberechnung.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore & Build
        run: dotnet build Callora.Host.sln --configuration Release --nologo

      - name: Test
        run: dotnet test Callora.Host.sln --configuration Release --no-build --nologo

      # This repository ships packages, not a process. The previous step published
      # src/Core as "the host backend"; Core has been OutputType=Library since the
      # module split, so that artifact had no entry point and could not start. What
      # consumers actually need are the packages a distribution composes.
      - name: Pack framework packages
        run: >
          dotnet pack Callora.Host.sln
          --configuration Release --no-build
          --output artifacts/packages

      # NuGet lädt einen Analyzer allein anhand des Pfades analyzers/{framework}/{sprache}.
      # Liegt die DLL eine Ebene tiefer — was etwa BuildOutputTargetFolder verursacht, das
      # den TFM-Ordner anhängt — installiert sich das Paket klaglos und der Analyzer läuft
      # einfach nie. Ein Plugin-Autor merkte davon nichts außer, dass CAL0001 ihn nie warnt.
      - name: Analyzer-Paket liegt am ladbaren Pfad
        run: |
          pkg=$(ls artifacts/packages/Callora.Analyzers.*.nupkg)
          if ! unzip -l "$pkg" | grep -q 'analyzers/dotnet/cs/Callora\.Analyzers\.dll'; then
            echo "::error::Callora.Analyzers.dll liegt nicht unter analyzers/dotnet/cs — NuGet lädt den Analyzer dann nicht."
            unzip -l "$pkg"
            exit 1
          fi

      - name: Generate SBOM (.NET)
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX Callora.Host.sln --json --output artifacts/sbom --filename callora-host.cdx.json

      # Checksums over exactly what the release attaches, so a download can be
      # verified without trusting the transport.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum packages/*.nupkg packages/*.snupkg sbom/*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/sbom/*.cdx.json
            artifacts/SHA256SUMS

  smoke:
    name: Smoke — the packages compose into a host that starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A release that publishes packages should prove they are more than files. This
    # builds the repository's own composition and starts it against a real database,
    # so a package set that cannot boot fails the release rather than a customer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: callora_smoke
          POSTGRES_USER: callora
          POSTGRES_PASSWORD: callora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Start the host
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5199
          BackendHost__DatabaseConnectionString: Host=127.0.0.1;Port=5432;Database=callora_smoke;Username=callora;Password=callora
          BackendHost__ApiKeys__0: smoke-key
          CalloraHosting__AutoLoadPlugins: "false"
        run: |
          dotnet run --project src/Host/Dev/Callora.Host.Dev.csproj --no-launch-profile > host.log 2>&1 &
          echo $! > host.pid

      # /ready rather than /health: liveness only says the process answers, readiness
      # says it reached its database. That is the claim worth making about a package
      # set. Both sit behind the API key, so the probe carries one.
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS -H "X-Callora-Api-Key: smoke-key" http://127.0.0.1:5199/ready > /dev/null; then
              echo "host is ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "host did not become ready" >&2
          cat host.log >&2 || true
          exit 1

      - name: Stop the host
        if: always()
        run: kill "$(cat host.pid)" || true
