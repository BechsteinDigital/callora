; Minimal pjsip config for the B4-deep-3 Asterisk registration/echo spike.
; One UDP transport + one registering endpoint (callora/callora) + an echo AOR.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[callora]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=callora-auth
aors=callora
direct_media=no
; The SDK offers SRTP (RTP/SAVP + SDES crypto) by default; accept it so media negotiates.
media_encryption=sdes

[callora-auth]
type=auth
auth_type=userpass
username=callora
password=callora

; AOR name must match the registering user-part (pjsip registrar looks it up by user).
[callora]
type=aor
max_contacts=5
remove_existing=yes
