<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Callora Administration</title>
    <!-- Setzt das gespeicherte Farbschema vor dem ersten Paint. Eigene Datei statt inline,
         weil die CSP des Hosts `script-src 'self'` ohne 'unsafe-inline' sendet — inline
         wurde es blockiert, und die Seite sprang um. Kein defer/async: Es muss vor dem
         ersten Paint laufen.
         %BASE_URL% und nicht ./ — die SPA liefert diese Datei unter JEDEM Pfad unterhalb
         von /admin/ aus, ein relativer Verweis zeigte auf /admin/extensions/… und lief in
         einen 404. -->
    <script src="%BASE_URL%theme-preference.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
