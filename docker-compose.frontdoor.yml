services:
  callora-frontdoor:
    image: caddy:2.8
    container_name: ${DEV_FRONTDOOR_CONTAINER_NAME:-callora-frontdoor-dev}
    restart: unless-stopped
    depends_on:
      callora-backend:
        condition: service_started
    ports:
      - "${DEV_FRONTDOOR_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-callora-backend:5000}
    volumes:
      - ./ops/local-frontdoor/Caddyfile:/etc/caddy/Caddyfile:ro
