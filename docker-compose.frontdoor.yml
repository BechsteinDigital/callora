services:
  callora-frontdoor:
    image: caddy:2.8
    container_name: ${DEV_FRONTDOOR_CONTAINER_NAME:-callora-frontdoor-dev}
    restart: unless-stopped
    depends_on:
      callora-backend:
        condition: service_started
    ports:
      - "${DEV_FRONTDOOR_PORT:-8080}:80"
    # Der Host läuft im Host-Netz, die Frontdoor nicht — der Compose-Name callora-backend löst
    # von hier aus nicht mehr auf. Über das Gateway erreicht sie ihn trotzdem, und die Frontdoor
    # bleibt im Bridge-Netz, damit ihr Portmapping auf 8080 weiter das tut, wofür es da ist.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:${DEV_CALLORA_PORT:-5000}}
    volumes:
      - ./ops/local-frontdoor/Caddyfile:/etc/caddy/Caddyfile:ro
